<style>
:root {
  --cream:#faf5ed;
  --blush:#efd8dc;
  --rose:#e6cbd2;
  --plum:#513a4b;
  --ink:#2b2329;
  --white:#fffaf6;
}

* { box-sizing:border-box; }

html { scroll-behavior:smooth; }

body {
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:"Cormorant Garamond",serif;
}

a { color:inherit;text-decoration:none; }
button { cursor:pointer; }
img { display:block;width:100%;height:100%;object-fit:cover; }
h1,h2,h3,p { margin:0; }

.script {
  font-family:"Great Vibes",cursive;
  font-weight:400;
}

.eyebrow {
  font:400 11px Jost,sans-serif;
  letter-spacing:3px;
  text-transform:uppercase;
}

.container {
  max-width:1500px;
  margin:auto;
  padding:0 5%;
}

.section { padding:105px 0; }

.heading {
  font-size:clamp(52px,7vw,105px);
  font-weight:300;
  line-height:.95;
}

.btn {
  display:inline-flex;
  align-items:center;
  justify-content:space-between;
  gap:35px;
  border:1px solid currentColor;
  padding:17px 24px;
  font:400 10px Jost,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
  transition:.3s;
}

.btn:hover {
  background:var(--plum);
  color:white;
  border-color:var(--plum);
}

.placeholder {
  position:relative;
  background:linear-gradient(135deg,#e7d0d6,#f8ece8);
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:220px;
}

.placeholder img {
  position:absolute;
  inset:0;
}

.placeholder span {
  text-align:center;
  padding:25px;
  font:11px Jost,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#957f8b;
}

/* HEADER */

.header {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  z-index:50;
  color:white;
  background:linear-gradient(to bottom,rgba(35,20,30,.35),transparent);
}

.header-inner {
  max-width:1600px;
  margin:auto;
  padding:22px 5%;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:25px;
  align-items:center;
}

.nav-left,.nav-right {
  display:flex;
  gap:35px;
  align-items:center;
}

.nav-right { justify-content:flex-end; }

.header nav a {
  font:400 10px Jost,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
}

.brand {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
}

.brand img {
  width:65px;
  height:65px;
  object-fit:contain;
}

.brand strong {
  font-size:30px;
  font-weight:400;
  white-space:nowrap;
}

.mobile-button {
  display:none;
  border:0;
  background:none;
  color:inherit;
  font-size:28px;
}

.mobile-nav { display:none; }

body:not(.home) .header {
  position:relative;
  color:var(--plum);
  background:var(--cream);
  border-bottom:1px solid #e4d5dc;
}

/* HERO */

.hero {
  height:95svh;
  min-height:650px;
  max-height:980px;
  position:relative;
  overflow:hidden;
  background:#d8bdc6;
}

.hero img {
  position:absolute;
  inset:0;
  object-position:center;
}

.hero:after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(28,15,25,.38),transparent 65%);
}

.hero-content {
  position:absolute;
  z-index:2;
  left:6%;
  bottom:14%;
  color:white;
}

.hero-content h1 {
  font-size:clamp(95px,13vw,220px);
  line-height:.72;
  letter-spacing:-.07em;
  font-weight:300;
  margin:30px 0;
}

.hero-content p {
  font-size:26px;
  font-style:italic;
  margin-bottom:30px;
}

/* WELCOME */

.welcome {
  display:grid;
  grid-template-columns:28% 44% 28%;

}

.welcome>.placeholder { min-height:680px; }

.welcome-center {

  align-items:center;

}

.welcome-center h2 {
  font-size:clamp(80px,9vw,140px);
  line-height:.9;
  margin-bottom:25px;
}

.welcome-center p {
  font-size:clamp(20px,1.8vw,29px);
  line-height:1.55;
}

.welcome-center a {
  font-size:22px;
  font-style:italic;
  margin-top:35px;
  border-bottom:1px solid;
}

/* PINK QUOTE */

.quote {
  background:var(--blush);
  text-align:center;
  padding:75px 10%;
}

.quote p {
  font-size:clamp(25px,3vw,43px);
  font-style:italic;
  line-height:1.25;
  max-width:1150px;
  margin:auto;
}

.quote .script {
  font-size:47px;
  display:block;
  margin-top:20px;
}

/* UNEQUAL COLLAGE */

.collage-section {
  background:#e5cfd0;
  padding:100px 0 125px;
  overflow:hidden;
}

.collage-section h2 {
  text-align:center;
  margin-bottom:60px;
}

.collage {

  align-items:center;
  padding:40px 0 65px;
}

.collage .photo {
  border:9px solid #f9f1eb;
  box-shadow:0 20px 40px #43263138;

}

.collage .photo:nth-child(1) {
  height:310px;

}

.collage .photo:nth-child(2) {

  z-index:3;
}

.collage .photo:nth-child(3) {
  height:350px;

  z-index:4;
}

.collage .photo:nth-child(4) {
  height:440px;
  transform:rotate(5deg) translate(-25px,-15px);
  z-index:2;
}

.collage .photo:nth-child(5) {
  height:310px;
  transform:rotate(-5deg) translate(-40px,65px);
  z-index:5;
}

.center { text-align:center; }

/* STORY — LARGE OVAL */

.story {
  background:linear-gradient(110deg,#d6b9b7,#f8eee7,#ddc6cb);
  padding:125px 0;
  overflow:hidden;
}

.story-grid {

}

.story-visual {

.story-oval {

}

.story-oval .placeholder {

.story-small {

.story-text {

  text-align:center;
  margin-left:-35px;

.story-text h2 {

  font-weight:300;
  line-height:.85;
  margin:20px 0 30px;
}

.story-text p {
  font-size:29px;
  font-style:italic;
  line-height:1.3;
  margin-bottom:35px;
}

/* CATEGORIES — STAGGERED */

.categories { background:#fcf8f4; }

.categories-header {
  text-align:center;
  margin-bottom:65px;

.categories-header h2 { margin-top:15px; }

.categories-grid {

.category:nth-child(3n+2) { margin-top:85px; }

.category .placeholder { height:470px; }

.category:nth-child(3n+2) .placeholder { height:385px; }
.category:nth-child(3n) .placeholder { height:425px; }

.category h3 {
  font-size:clamp(32px,3.5vw,52px);
  font-weight:300;
  margin:17px 0 8px;
}

.category small {
  font:10px Jost,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
  border-bottom:1px solid #a58c9b;
  padding-bottom:9px;
}

/* CHOCOLATES */

.sweets {
  background:#ecd7dd;
  padding:100px 0;
}

.sweets-grid {
  display:grid;
  grid-template-columns:.85fr 1.1fr 1fr;
  gap:25px;
  align-items:center;

.sweets-copy h2 {

  font-weight:300;
  line-height:.9;
  margin:20px 0;

.sweets-copy p {
  font-size:25px;
  font-style:italic;
  margin-bottom:30px;
}

.sweet .placeholder { height:430px; }
.sweet:last-child { transform:translateY(55px); }

.sweet h3 {
  font-size:32px;
  font-weight:300;
  margin-top:15px;
}

/* DARK TRAINING */

.training {
  min-height:730px;
  position:relative;
  display:flex;
  align-items:center;
  background:#171216;
  color:white;
  overflow:hidden;
}

.training-bg {
  position:absolute;
  inset:0;
  opacity:.45;
}

.training-bg img { filter:brightness(.5); }

.training-content {
  position:relative;
  z-index:2;
  padding:125px 8%;
}

.training-content h2 {
  font-size:clamp(75px,10vw,160px);
  font-weight:300;
  line-height:.78;
  margin:25px 0;
}

.training-content .script {
  display:block;
  font-size:.8em;
  margin-left:10vw;
}

.training-content p {
  font-size:27px;
  font-style:italic;
  max-width:570px;
  margin:40px 0;
}

.training .btn:hover {
  background:white;
  color:#171216;
  border-color:white;
}

/* ROUND CAROUSEL */

.round-section {
  background:#faf5f0;
  padding:110px 0;
}

.round-section h2 {
  text-align:center;
  font-size:clamp(50px,6vw,90px);
  font-weight:300;
  margin-bottom:50px;
}

.carousel-row {
  display:flex;
  align-items:center;
  gap:18px;
}

.carousel-track {
  display:flex;
  gap:25px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  flex:1;
}

.carousel-track::-webkit-scrollbar { display:none; }

.circle-card {
  flex:0 0 clamp(190px,22vw,330px);
  scroll-snap-align:center;
  text-align:center;
}

.circle-card .placeholder {
  aspect-ratio:1;
  border-radius:50%;
  border:6px solid #f1e5e7;
}

.circle-card p {
  font-size:25px;
  margin-top:15px;
}

.arrow {
  flex:0 0 43px;
  width:43px;
  height:43px;
  border-radius:50%;
  border:1px solid #987e8e;
  background:transparent;
  color:var(--plum);
  font-size:25px;
}

/* REVIEWS */

.reviews {
  background:#ead6db;
  padding:100px 0;
}

.reviews h2 {
  text-align:center;
  font-size:clamp(55px,7vw,100px);
  font-weight:300;
  margin-bottom:50px;
}

.review-layout {
  display:flex;
  align-items:center;
  gap:20px;
  max-width:1100px;
  margin:auto;
}

.review-panel {
  background:#faf0ea;
  flex:1;
  min-height:360px;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
}

.review-copy {
  padding:40px;
  text-align:center;
}

.review-copy blockquote {
  font-size:clamp(27px,3vw,43px);
  font-style:italic;
  margin:0 0 20px;
}

.review-copy small { font-size:19px; }

.review-panel .placeholder {
  height:360px;
  transform:rotate(5deg) scale(.9);
}

/* CONTACT */

.contact {
  background:linear-gradient(110deg,#e7cbd2,#f8ece7,#e3cbd4);
  padding:95px 0;
}

.contact-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.contact h2 {
  font-size:clamp(50px,6vw,85px);
  font-weight:300;
  margin:15px 0 20px;
}

.contact p {
  font-size:25px;
  font-style:italic;
  max-width:520px;
  margin-bottom:30px;
}

.contact-links {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.contact-links a,
.contact-links span {
  padding:15px 0;
  border-bottom:1px solid #bda8b3;
  font:12px Jost,sans-serif;
}

/* FOOTER */

footer {
  background:#f8f1ed;
  padding:65px 0 25px;
}

.footer-grid {
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  gap:55px;
}

.footer-brand {
  display:flex;
  align-items:center;
  gap:15px;
}

.footer-brand img {
  width:75px;
  height:75px;
  object-fit:contain;
}

.footer-brand strong {
  font-size:35px;
  font-weight:400;
}

footer h3 {
  font-size:29px;
  font-weight:400;
  margin-bottom:20px;
}

footer a.footer-link {
  display:block;
  font-size:19px;
  margin-bottom:12px;
}

footer p {
  font-size:20px;
  margin-top:20px;
}

.copyright {
  margin-top:65px;
  padding-top:20px;
  border-top:1px solid #dfd2d8;
  font:11px Jost,sans-serif;
  letter-spacing:1px;
}

/* SUBPAGES */

.subhero {
  background:#ebd7dc;
  padding:110px 25px;
  text-align:center;
}

.subhero h1 {
  font-size:clamp(60px,9vw,140px);
  font-weight:300;
  line-height:.9;
  margin:20px 0;
}

.subhero p { font-size:26px;font-style:italic; }

.subpage {
  padding:100px 0;
}

.back {
  display:inline-block;
  margin-bottom:40px;
  font:11px Jost,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
}

.empty-state {
  background:#f2e5e7;
  padding:90px 30px;
  text-align:center;
}

.empty-state h2 {
  font-size:55px;
  font-weight:300;
}

.empty-state p {
  font-size:25px;
  margin:20px 0 30px;
}

.products {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

.product .placeholder { height:440px; }
.product h3 { font-size:35px;margin:20px 0 10px; }
.product p { font-size:23px; }

.detail {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:center;
}

.detail .placeholder { height:600px; }
.detail h2 { font-size:75px;font-weight:300; }
.detail p { font-size:27px;margin:25px 0; }

/* MOBILE */

@media(max-width:900px) {
  .header-inner {
    grid-template-columns:1fr auto;
  }

  .nav-left,.nav-right { display:none; }
  .mobile-button { display:block; }

  .mobile-nav.open {
    display:flex;
    flex-direction:column;
    gap:20px;
    padding:25px 5%;
    background:#f8f1ed;
    color:var(--plum);
  }

  .mobile-nav a {
    font:12px Jost,sans-serif;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .welcome { grid-template-columns:1fr 1fr; }
  .welcome-center { grid-column:1/-1;grid-row:1; }
  .welcome>.placeholder { min-height:350px; }

  .story-grid,.contact-grid,.detail {
    grid-template-columns:1fr;
  }

  .story-text { margin-left:0;margin-top:40px; }

  .categories-grid,.products {
    grid-template-columns:repeat(2,1fr);
  }

  .sweets-grid { grid-template-columns:1fr 1fr; }
  .sweets-copy { grid-column:1/-1; }

  .footer-grid { grid-template-columns:1fr 1fr; }
}

@media(max-width:600px) {
  .section,.subpage { padding:75px 0; }

  .header-inner { padding:15px 5%; }
  .brand img { width:50px;height:50px; }
  .brand strong { font-size:24px; }

  .hero { min-height:640px;height:85svh; }
  .hero-content { left:6%;bottom:13%; }
  .hero-content h1 { font-size:75px; }

  .welcome-center { padding:70px 25px; }
  .welcome-center h2 { font-size:85px; }
  .welcome>.placeholder { min-height:250px; }

  .collage {
    display:flex;
    width:max-content;
    min-width:100%;
    gap:0;
    padding-left:15px;
  }

  .collage .photo {
    width:180px;
    flex:0 0 180px;
    height:280px!important;
  }

  .story-visual { min-height:370px; }
  .story-oval { height:370px; }
  .story-small { height:145px; }

  .categories-grid,.products,.sweets-grid {
    grid-template-columns:1fr;
  }

  .category:nth-child(n) { margin-top:0; }
  .category .placeholder { height:400px!important; }
  .sweet:last-child { transform:none; }

  .training { min-height:600px; }
  .training-content { padding:100px 6%; }
  .training-content h2 { font-size:70px; }

  .review-panel { grid-template-columns:1fr; }
  .review-panel .placeholder { height:240px; }

  .contact-links { grid-template-columns:1fr; }
  .footer-grid { grid-template-columns:1fr; }
  .detail .placeholder { height:400px; }
}

/* =========================================
   HELPERS
========================================= */

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function photo(src,label,className="") {
  return `<div class="placeholder ${className}">
    ${src
      ? `<img src="${esc(src)}" alt="${esc(label)}" loading="lazy">`
      : `<span>Photographie à venir<br>${esc(label)}</span>`
    }
  </div>`;
}

function button(text,url) {
  return `<a class="btn" href="${esc(url)}">${esc(text)} <span>→</span></a>`;
}

function wa(message) {
  const phone = SETTINGS.whatsapp.replace(/\D/g,"");
  return phone
    ? "https://wa.me/"+phone+"?text="+encodeURIComponent(message)
    : "";
}

function order(text,message) {
  const link = wa(message);
  return link
    ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${esc(text)} →</a>`
    : button(text,"?page=contact");
}

function categoryCard(c) {
  return `<a class="category" href="?page=collection&id=${encodeURIComponent(c.id)}">
    ${photo(c.image,c.title)}
    <h3>${esc(c.title)}</h3>
    <small>Découvrir la collection →</small>
  </a>`;
}

let reviewIndex = 0;

function reviewMarkup() {
  if (!REVIEWS.length) {
    return `
      <div class="review-copy">
        <blockquote>Vos mots sont précieux.</blockquote>
        <small>Les témoignages authentiques seront ajoutés prochainement.</small>
      </div>
      ${photo("","Création pâtissière")}
    `;
  }

  const r = REVIEWS[reviewIndex];

  return `
    <div class="review-copy">
      <blockquote>« ${esc(r.text)} »</blockquote>
      <small>— ${esc(r.author)}</small>
    </div>
    ${photo(r.image || "","Création pâtissière")}
  `;
}

function reviewSection() {
  return `
    <section class="reviews">
      <div class="container">
        <h2>Vos beaux messages</h2>

        <div class="review-layout">
          <button class="arrow" onclick="moveReview(-1)" aria-label="Avis précédent">‹</button>

          <div class="review-panel" id="reviewPanel">
            ${reviewMarkup()}
          </div>

          <button class="arrow" onclick="moveReview(1)" aria-label="Avis suivant">›</button>
        </div>
      </div>
    </section>
  `;
}

function moveReview(direction) {
  if (!REVIEWS.length) return;

  reviewIndex = (reviewIndex + direction + REVIEWS.length) % REVIEWS.length;

  const panel = document.getElementById("reviewPanel");
  if (panel) panel.innerHTML = reviewMarkup();
}

function slideCircles(direction) {
  const track = document.getElementById("circleTrack");
  if (track) track.scrollBy({left:direction*320,behavior:"smooth"});
}

/* =========================================
   ROUTER
========================================= */

function render() {
  const query = new URLSearchParams(location.search);
  const page = query.get("page") || "home";
  const id = query.get("id");

  const pages = {
    home,
    creations,
    histoire,
    formations,
    avis,
    contact:contactPage
  };

  document.getElementById("app").innerHTML =
    page==="collection" ? collection(id) :
    page==="produit" ? produit(id) :
    pages[page] ? pages[page]() :
    missing();

  document.body.classList.toggle("home",page==="home");
  document.title = page==="home"
    ? "Tatev Gateux — Créations d'exception"
    : page+" | Tatev Gateux";

  window.scrollTo(0,0);
}

document.getElementById("menuButton").addEventListener("click",()=>{
  const menu = document.getElementById("mobileNav");
  const open = menu.classList.toggle("open");
  document.getElementById("menuButton").setAttribute("aria-expanded",String(open));
});

document.getElementById("year").textContent = new Date().getFullYear();

render();
