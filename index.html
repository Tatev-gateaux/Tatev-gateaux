
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tatev Cakes | Elegant Cake Boutique</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ivory: #fffaf4;
      --rose: #b58f89;
      --dark: #493a36;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f5e8e2;
      font-family: 'Jost', sans-serif;
      overflow-x: hidden;
    }

    /* =========================
       FULL SCREEN HERO
    ========================= */

    .hero {
      width: 100%;
      min-height: 650px;
      height: 100svh;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .hero-background {
      position: absolute;
      inset: 0;
      background-image: url("https://cdn.shopify.com/s/files/1/0840/7020/3650/files/73b639e0-b600-4c55-9c61-72e6177930f5.png?v=1792517078");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -2;
      animation: heroAppear 1.5s ease-out both;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(50, 32, 29, 0.13) 0%,
        transparent 35%
      );
      z-index: -1;
      pointer-events: none;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: relative;
      width: 100%;
      padding: 40px 5% 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1700px;
      margin: auto;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 50px;
      align-items: start;
    }

    /* =========================
       LOGO ON LEFT
    ========================= */

    .logo {
      display: block;
      width: 100%;
      max-width: 310px;
      text-decoration: none;
    }

    .logo img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 205px;
      object-fit: contain;
      object-position: left top;
      mix-blend-mode: multiply;
    }

    /* =========================
       TWO ROW NAVIGATION
    ========================= */

    .menu-area {
      width: 100%;
      padding-top: 10px;
    }

    .primary-menu {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(255, 250, 244, 0.42);
    }

    .primary-menu a {
      color: var(--ivory);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }

    .secondary-menu {
      display: flex;
      align-items: center;
      gap: clamp(18px, 3vw, 55px);
      padding-top: 20px;
    }

    .secondary-menu a {
      color: var(--ivory);
      text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      font-style: italic;
      font-weight: 400;
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }

    .primary-menu a:hover,
    .secondary-menu a:hover {
      opacity: 0.65;
    }

    /* =========================
       MOBILE MENU BUTTON
    ========================= */

    .mobile-toggle {
      display: none;
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 8px;
    }

    .mobile-toggle span {
      display: block;
      width: 27px;
      height: 1px;
      margin: 7px auto;
      background: white;
      transition: 0.3s ease;
    }

    @keyframes heroAppear {
      from {
        opacity: 0.5;
        transform: scale(1.035);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1100px) {
      .header-inner {
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 25px;
      }

      .logo img {
        max-height: 150px;
      }

      .primary-menu a {
        font-size: 10px;
        letter-spacing: 1.2px;
      }

      .secondary-menu {
        gap: 20px;
      }

      .secondary-menu a {
        font-size: 17px;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {
      .hero {
        min-height: 600px;
        height: 100svh;
      }

      .hero-background {
        background-position: center center;
      }

      .header {
        padding: 20px 5% 0;
      }

      .header-inner {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
      }

      .logo {
        max-width: 165px;
      }

      .logo img {
        max-height: 110px;
      }

      .mobile-toggle {
        display: block;
        flex-shrink: 0;
        margin-top: 5px;
        position: relative;
        z-index: 20;
      }

      .menu-area {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        padding: 28px 25px 35px;
        background: rgba(248, 240, 234, 0.98);
        box-shadow: 0 12px 25px rgba(0,0,0,0.08);
      }

      .header.menu-open .menu-area {
        display: block;
      }

      .primary-menu,
      .secondary-menu {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
      }

      .primary-menu {
        padding-bottom: 25px;
        border-bottom: 1px solid rgba(73,58,54,.15);
      }

      .secondary-menu {
        padding-top: 25px;
      }

      .primary-menu a,
      .secondary-menu a {
        color: var(--dark);
        text-shadow: none;
      }

      .primary-menu a {
        font-size: 12px;
      }

      .secondary-menu a {
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-background {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main>

    <section class="hero" id="home">

      <div class="hero-background"></div>

      <header class="header" id="siteHeader">

        <div class="header-inner">

          <!-- LEFT LOGO -->
          <a href="#home" class="logo" aria-label="Tatev Cakes Home">
            <img
              src="https://cdn.shopify.com/s/files/1/0840/7020/3650/files/Screenshot_2026-10-18_203717.png?v=1792342719"
              alt="Tatev Cakes"
            >
          </a>

          <!-- RIGHT NAVIGATION -->
          <div class="menu-area" id="menuArea">

            <nav class="primary-menu" aria-label="Main menu">
              <a href="#home">Home</a>
              <a href="#design-process">Design Process</a>
              <a href="#portfolio">Portfolio</a>
              <a href="#shop">Shop</a>
              <a href="#enquire">Enquire</a>
            </nav>

            <nav class="secondary-menu" aria-label="Additional menu">
              <a href="#about">About</a>
              <a href="#menu">The Menu</a>
              <a href="#faq">Frequently Asked Questions</a>
            </nav>

          </div>

          <!-- MOBILE MENU BUTTON -->
          <button
            class="mobile-toggle"
            id="menuToggle"
            type="button"
            aria-label="Open navigation"
            aria-controls="menuArea"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

        </div>

      </header>

    </section>

  </main>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const siteHeader = document.getElementById('siteHeader');

    menuToggle.addEventListener('click', function () {
      const isOpen = siteHeader.classList.toggle('menu-open');

      menuToggle.setAttribute(
        'aria-expanded',
        String(isOpen)
      );
    });

    document.querySelectorAll('.menu-area a').forEach(link => {
      link.addEventListener('click', function () {
        siteHeader.classList.remove('menu-open');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>

</body>
</html>
