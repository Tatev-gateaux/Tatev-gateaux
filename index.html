
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tatev Cakes | Luxury Cake Boutique</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f8f1e9;
      --ink: #49372f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--ink);
    }

    /* MAIN HERO */

    .hero {
      width: 100%;
      min-height: 700px;
      height: 100svh;
      position: relative;
      overflow: hidden;
      background: #d6b9a9;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      background-image: url('https://cdn.shopify.com/s/files/1/0840/7020/3650/files/73b639e0-b600-4c55-9c61-72e6177930f5.png?v=1792517078');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      animation: heroReveal 1.5s ease both;
    }

    /* TRANSPARENT HEADER */

    .site-header {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 5%;
      background: transparent;
    }

    .header-inner {
      max-width: 1600px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 35px;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.4vw, 42px);
    }

    .navigation.right {
      justify-content: flex-end;
    }

    .navigation a {
      position: relative;
      color: #fffaf5;
      text-decoration: none;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 1px 9px rgba(53, 33, 24, .4);
      transition: opacity .3s ease;
    }

    .navigation a:hover {
      opacity: .65;
    }

    .navigation a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0;
      height: 1px;
      background: currentColor;
      transition: width .35s ease;
    }

    .navigation a:hover::after {
      width: 100%;
    }

    /* CENTER LOGO */

    .logo-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      text-decoration: none;
    }

    .logo-link img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 115px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    /* MOBILE MENU */

    .menu-toggle {
      display: none;
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      padding: 10px;
    }

    .menu-toggle span {
      display: block;
      width: 26px;
      height: 1px;
      background: currentColor;
      margin: 6px 0;
    }

    @keyframes heroReveal {
      from {
        opacity: .5;
        transform: scale(1.035);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 900px) {
      .hero {
        min-height: 600px;
        height: 100svh;
      }

      .hero-image {
        background-position: center;
      }

      .site-header {
        padding: 18px 5%;
      }

      .header-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo-link {
        width: 135px;
      }

      .menu-toggle {
        display: block;
        order: 2;
      }

      .navigation {
        display: none;
      }

      .site-header.menu-open .navigation {
        display: flex;
        position: absolute;
        left: 0;
        right: 0;
        background: rgba(250, 245, 240, .98);
        flex-direction: column;
        align-items: center;
        gap: 25px;
        padding: 28px 20px;
      }

      .site-header.menu-open .navigation.left {
        top: 100%;
      }

      .site-header.menu-open .navigation.right {
        top: calc(100% + 140px);
      }

      .site-header.menu-open .navigation a {
        color: var(--ink);
        text-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <section class="hero" id="home">

    <div class="hero-image"></div>

    <header class="site-header" id="siteHeader">
      <div class="header-inner">

        <!-- LEFT MENU -->
        <nav class="navigation left" aria-label="Main navigation">
          <a href="#home">Home</a>
          <a href="#collections">Our Cakes</a>
          <a href="#about">About Us</a>
        </nav>

        <!-- CENTER LOGO -->
        <a href="#home" class="logo-link" aria-label="Tatev Cakes Home">
          <img
            id="brandLogo"
            src="https://cdn.shopify.com/s/files/1/0840/7020/3650/files/Screenshot_2026-10-18_203717.png?v=1792342719"
            alt="Tatev Cakes Logo">
        </a>

        <!-- RIGHT MENU -->
        <nav class="navigation right" aria-label="Additional navigation">
          <a href="#gallery">Gallery</a>
          <a href="#contact">Contact</a>
        </nav>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Toggle menu"
          aria-expanded="false"
          onclick="toggleMenu()">
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>
    </header>

  </section>

  <script>
    function toggleMenu() {
      const header = document.getElementById('siteHeader');
      const button = document.querySelector('.menu-toggle');
      const isOpen = header.classList.toggle('menu-open');
      button.setAttribute('aria-expanded', String(isOpen));
    }

    // Remove a white background from the logo.
    const logo = document.getElementById('brandLogo');

    logo.addEventListener('load', function () {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = logo.naturalWidth;
        canvas.height = logo.naturalHeight;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(logo, 0, 0);

        const image = ctx.getImageData(
          0, 0, canvas.width, canvas.height
        );

        const data = image.data;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const min = Math.min(r, g, b);

          if (min > 245) {
            data[i + 3] = 0;
          } else if (min > 215) {
            data[i + 3] = Math.round(
              data[i + 3] * (245 - min) / 30
            );
          }
        }

        ctx.putImageData(image, 0, 0);
        logo.src = canvas.toDataURL('image/png');
      } catch (error) {
        // Keep original logo if browser restricts processing.
      }
    }, { once: true });

    logo.crossOrigin = 'anonymous';
  </script>

</body>
</html>
